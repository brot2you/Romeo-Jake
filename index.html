<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roméo Jake · Le livre magique</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#385b78,#102039 75%);color:#233249;font-family:Arial,sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f2bb5d;outline-offset:3px}.app{max-width:1250px;margin:auto;padding:12px 18px 30px}.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:#0b2037e8;border:1px solid #7594ac;padding:12px 16px;border-radius:16px;color:white;margin-bottom:16px}.brand{font:bold 22px Georgia,serif;color:#ffe2a1}.brand small{display:block;font:11px Arial,sans-serif;letter-spacing:2px;color:#c6d8e5}.settings{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.settings label{font-size:13px}.settings select,.settings button{background:#fff7e6;color:#233249;border:0;border-radius:10px;padding:10px 12px;font-weight:bold}.settings button[aria-pressed=true]{background:#ffdc8a}.stage{perspective:2200px}.book{width:100%;height:min(69vh,680px);min-height:490px;display:grid;grid-template-columns:1fr 1fr;position:relative;background:#f9ebcf;border:9px solid #94643d;border-radius:15px;box-shadow:0 15px 0 #513621,0 30px 35px #020b17a8;transform-style:preserve-3d}.book:after{content:"";position:absolute;left:calc(50% - 8px);width:16px;top:0;bottom:0;background:linear-gradient(90deg,#856c53aa,#fff8e7,#856c53aa);pointer-events:none;z-index:3}.leaf{min-width:0;position:relative;overflow:hidden}.art{background:url('assets/romeo-jake.png') center/cover;position:absolute;inset:0}.art.night{filter:brightness(.58) saturate(.75)}.art.mouse{background-position:8% 60%}.art.hero{background-position:58% 42%}.art.sea{background-position:12% 45%}.art.treasure{background-position:95% 78%}.left{background:#183655}.scene-title{position:absolute;left:24px;bottom:20px;background:#142b48d9;color:#fff6db;padding:12px 17px;border-radius:10px;font:italic 23px Georgia,serif}.right{background:linear-gradient(110deg,#f2dfb9,#fffaf0 12%,#fffaf0 92%,#ead4a8)}.reading{height:100%;display:flex;flex-direction:column;padding:clamp(20px,3vw,43px);gap:13px;overflow-y:auto;scrollbar-width:thin}.chapter{font:bold 12px Arial,sans-serif;letter-spacing:2px;color:#926d40}.reading h1{font:700 clamp(26px,3vw,39px) Georgia,serif;margin:0;color:#254568}.narration{font:16px/1.5 Georgia,serif;color:#4f5861;background:#f4ead6;border-left:4px solid #b79b6f;padding:12px 15px;border-radius:5px}.narration strong{display:block;font:700 11px Arial,sans-serif;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:5px;color:#7c694f}.read-label{font:bold 13px Arial,sans-serif;color:#2a5a82;text-transform:uppercase;letter-spacing:1.5px}.read-text{font:700 clamp(29px,3.5vw,46px)/1.4 Arial,sans-serif;background:#fff;border:2px solid #d3bc92;border-radius:15px;padding:18px;text-align:center;letter-spacing:.015em;min-height:100px;display:grid;place-items:center;overflow-wrap:anywhere}.read-text .syll:nth-child(odd){color:#176eb1}.read-text .syll:nth-child(even){color:#d05b31}.read-text .mute-letter{color:#a6a6a6}.read-text .plain{color:#21384d}.read-text .word{display:inline-block;margin:0 .14em}.read-text .syll{display:inline}.reader-tools{display:flex;gap:9px;flex-wrap:wrap}.reader-tools button,.challenge button{border:1px solid #b9a17e;border-radius:10px;background:#fff6df;padding:10px 12px;font-weight:bold;color:#254568}.challenge{background:#eaf4fa;border:1px solid #a6c8dc;border-radius:13px;padding:12px}.challenge h2{font-size:14px;margin:0 0 8px;color:#225377}.challenge p{margin:0 0 9px;font-size:15px}.answers{display:flex;gap:8px;flex-wrap:wrap}.answers button{font-size:20px;background:white;min-width:56px}.feedback{font-size:13px;font-weight:bold;min-height:18px;margin-top:7px;color:#2e7652}.nav{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:27px;position:relative;z-index:5}.nav button{background:#f9e2aa;border:2px solid #b88b49;border-radius:40px;padding:13px 22px;font-weight:800;color:#273d50;box-shadow:0 4px 0 #7b582e}.nav button:disabled{opacity:.4}.count{color:#fff0d1;min-width:130px;text-align:center;font-weight:bold}.help{color:#d9e5ef;text-align:center;font-size:13px;margin-top:13px}.flip{position:absolute;z-index:8;top:0;left:50%;width:50%;height:100%;transform-origin:left;transform-style:preserve-3d;pointer-events:none;animation:turn .68s ease-in-out forwards}.flip.backwards{left:0;transform-origin:right;animation:turnback .68s ease-in-out forwards}.flip .side{position:absolute;inset:0;backface-visibility:hidden;background:#f8ead0;border:2px solid #dbc6a0}.flip .rear{transform:rotateY(180deg);background:#ead9b8}@keyframes turn{to{transform:rotateY(-180deg)}}@keyframes turnback{to{transform:rotateY(180deg)}}.cover{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,#071b3a99,#0a1b3caa),url('assets/romeo-jake.png') center/cover;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff4dc;text-align:center}.cover h1{font:700 clamp(55px,8vw,110px) Georgia,serif;color:#ffdf9c;text-shadow:0 5px 12px #09162c;margin:8px}.cover p{font:30px Georgia,serif;text-shadow:0 2px 8px #000}.cover button{background:#ffdb89;padding:16px 24px;border-radius:25px;border:3px solid white;font-weight:900;font-size:20px}.book.covermode:after{display:none}.level-note{background:#fff7e6;color:#594b37;padding:10px;border-radius:9px;font-size:13px}.mobile-art{display:none}@media(max-width:780px){.app{padding:8px 9px 25px}.toolbar{padding:10px}.brand{font-size:18px}.settings{width:100%;justify-content:space-between}.settings select,.settings button{font-size:12px;padding:8px}.book{display:block;height:min(73dvh,800px);min-height:530px;max-width:550px;margin:auto;border-width:6px}.book:after{display:none}.left{display:none}.right{height:100%}.mobile-art{display:block;height:30%;position:relative;overflow:hidden}.mobile-art .art{background-position:center 45%}.mobile-art .scene-title{font-size:16px;bottom:10px}.reading{height:70%;padding:16px;gap:9px}.reading h1{font-size:24px}.narration{font-size:13px;padding:8px}.read-text{font-size:clamp(24px,6vw,34px);padding:11px;min-height:65px}.challenge{padding:9px}.challenge p{font-size:13px}.answers button{font-size:17px;padding:7px}.reader-tools button{font-size:12px;padding:8px}.nav{margin-top:17px;gap:8px}.nav button{padding:11px;font-size:13px}.count{min-width:100px;font-size:12px}.flip{left:0;width:100%}.flip.backwards{left:0}.cover h1{font-size:60px}.cover p{font-size:23px}}@media(prefers-reduced-motion:reduce){.flip{animation-duration:.01s}}
</style></head><body><div class="app"><header class="toolbar"><div class="brand">✦ ROMÉO JAKE <small>LE PETIT PIRATE DES RÊVES</small></div><div class="settings"><label for="level">Niveau de lecture</label><select id="level"><option value="CP">CP</option><option value="CE1">CE1</option><option value="CE2">CE2</option><option value="CM1">CM1</option><option value="CM2">CM2</option></select><button id="colors" aria-pressed="true">🎨 Syllabes</button><button id="home">⌂ Couverture</button></div></header><main class="stage"><div class="book" id="book"></div></main><nav class="nav"><button id="prev">❮ Page précédente</button><span class="count" id="count">Couverture</span><button id="next">Page suivante ❯</button></nav><p class="help">Les commandes restent hors du livre. Sur mobile, glisse le doigt pour tourner les pages. Les textes de lecture changent selon le niveau choisi.</p></div><script>
const pages=[
['La nuit de Roméo','Roméo est dans son lit. Il n’arrive pas à dormir. La lune éclaire sa chambre.','ma','La lune est là.','Roméo regarde la lune par la fenêtre.','Ce soir, Roméo ne trouve pas le sommeil. Il écoute le vent dans les arbres.','Dans sa chambre silencieuse, Roméo contemple les étoiles et cherche en vain le sommeil.','night','Quel son entends-tu au début de « maman » ?',['m','s','l'],0],
['Un drôle de bruit','Soudain, un petit bruit vient du placard. Scritch… scritch… Roméo tend l’oreille.','mi','Il y a un bruit.','Un bruit étrange vient du placard.','Un léger grattement résonne derrière la porte du placard.','Un froissement mystérieux rompt le silence : quelque chose s’agite dans le placard.','night','Lis la syllabe « mi ».',['ma','mi','la'],1],
['Capitaine Moustache','Une petite souris sort du placard. Elle porte un chapeau de pirate ! « Bonsoir, Roméo ! »','ami','La souris est là.','Une souris dit bonsoir à Roméo.','La souris se présente : elle s’appelle Capitaine Moustache.','Une minuscule souris coiffée d’un tricorne se présente avec une révérence : Capitaine Moustache.','mouse','Quel mot peux-tu lire ?',['ami','ima','mai'],0],
['La clé dorée','Capitaine Moustache sort une clé brillante. « Une aventure nous attend ! »','la','La clé est là.','La souris montre une clé dorée.','Le capitaine approche sa clé d’une serrure secrète.','Capitaine Moustache révèle une clé dorée qui fait apparaître une serrure invisible.','mouse','Quelle syllabe fait l + a ?',['li','la','al'],1],
['La porte magique','Le placard s’ouvre sur un autre monde. Roméo découvre une mer immense.','il','Il a vu la mer.','Roméo passe la porte et voit la mer.','Derrière la porte, un océan scintille sous les étoiles.','En franchissant le seuil, Roméo découvre un monde parallèle où les vagues brillent comme des diamants.','sea','Lis le mot « il ».',['li','il','la'],1],
['Roméo devient Jake','Son pyjama devient une tenue de pirate. « Bienvenue, Roméo Jake ! »','mali','Il a un joli habit.','Roméo porte maintenant un habit de pirate.','Une pluie d’étincelles transforme son pyjama en costume de pirate.','Sous une pluie d’étincelles, Roméo se métamorphose en jeune capitaine : il devient Roméo Jake.','hero','Quelle syllabe commence « pirate » ?',['pi','pa','po'],0],
['Le bateau des rêves','Un bateau les attend sur la plage. Capitaine Moustache montre une carte.','la','La mer est là.','Le bateau part sur la mer.','Les voiles se gonflent : leur voyage peut commencer.','Le majestueux navire quitte la baie tandis que Capitaine Moustache déplie une ancienne carte.','sea','Lis « la ».',['al','li','la'],2],
['L’île des étoiles','Au loin, une île apparaît. « Nous devons retrouver une étoile perdue ! »','ami','Il a un ami.','Les deux amis vont sur une île.','Le capitaine et Roméo cherchent l’étoile disparue.','Une île mystérieuse se dessine à l’horizon : c’est là que l’étoile perdue serait cachée.','sea','Lis le mot « ami ».',['ami','mai','mia'],0],
['Le coffre caché','Sur l’île, Roméo Jake découvre un coffre derrière un rocher.','mi','Il a vu le coffre.','Roméo trouve un coffre sur la plage.','Un vieux coffre est dissimulé à l’ombre d’un rocher.','Au pied d’un rocher couvert de mousse, Roméo découvre un coffre oublié depuis longtemps.','treasure','Quelle syllabe est « mi » ?',['ma','mi','li'],1],
['Le trésor lumineux','Dans le coffre, une étoile brille. Roméo la soulève. Elle s’envole dans le ciel !','la','La jolie étoile luit.','Une étoile brille dans le coffre.','Roméo libère l’étoile qui retrouve sa place dans le ciel.','En soulevant l’étoile lumineuse, Roméo comprend que le véritable trésor est de lui rendre sa liberté.','treasure','Quelle lettre fait le son /l/ ?',['m','l','s'],1],
['Le retour','« Il est temps de rentrer », murmure Capitaine Moustache. La porte du placard réapparaît.','il','Il va au lit.','Roméo retourne dans sa chambre.','Le capitaine raccompagne Roméo par la porte magique.','Après leur aventure, Capitaine Moustache guide son ami jusqu’au passage secret du placard.','mouse','Lis « il ».',['il','li','la'],0],
['Bonne nuit, Roméo','Roméo retrouve son lit. « À demain, petit pirate ! » chuchote la souris. Roméo s’endort.','ami','Il a un ami.','Roméo sourit et s’endort.','Roméo ferme les yeux, heureux de sa belle aventure.','Rassuré par sa merveilleuse aventure, Roméo s’endort paisiblement en rêvant déjà de son prochain voyage.','night','Quel mot désigne un copain ?',['ami','mai','mia'],0]
];
let index=-1,level='CP',colored=true,busy=false;try{index=Math.max(-1,Math.min(11,+(localStorage.getItem('rj-v3-page')??-1)));level=localStorage.getItem('rj-v3-level')||'CP';colored=localStorage.getItem('rj-v3-colors')!=='false'}catch{}document.getElementById('level').value=level;const book=document.getElementById('book');const levels=['CP','CE1','CE2','CM1','CM2'];const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function colorize(s){if(!colored)return `<span class="plain">${escapeHtml(s)}</span>`;return s.split(/(\s+)/).map(word=>{if(/^\s+$/.test(word))return word;let syllables=word.match(/.{1,2}/g)||[word];return `<span class="word">${syllables.map(x=>`<span class="syll">${escapeHtml(x)}</span>`).join('')}</span>`}).join('')}function content(){if(index<0)return `<div class="cover"><div>✦ TOME 1 ✦</div><h1>ROMÉO<br>JAKE</h1><p>Le secret du placard</p><p style="font-size:18px">Avec Capitaine Moustache</p><button data-action="start">📖 Ouvrir le livre</button></div>`;let p=pages[index],reading=p[levels.indexOf(level)+2];return `<div class="leaf left"><div class="art ${p[7]}"></div><div class="scene-title">${escapeHtml(p[0])}</div></div><div class="leaf right"><div class="mobile-art"><div class="art ${p[7]}"></div><div class="scene-title">${escapeHtml(p[0])}</div></div><div class="reading"><div class="chapter">TOME 1 · PAGE ${index+1}/12</div><h1>${escapeHtml(p[0])}</h1><div class="narration"><strong>📖 L’histoire · à écouter ou à lire ensemble</strong>${escapeHtml(p[1])}</div><div class="read-label">👀 À toi de lire · ${level}</div><div class="read-text">${colorize(reading)}</div><div class="reader-tools"><button data-action="sound">🔊 Écouter</button><button data-action="slow">🐢 Écouter lentement</button><button data-action="hint">💡 Aide lecture</button></div><div class="level-note" id="hint" hidden>${level==='CP'?'Regarde chaque lettre. Dis les sons, puis assemble-les sans deviner grâce à l’image. Les couleurs sont un repère visuel, pas une règle phonétique.':'Lis le texte à ton rythme. Repère les groupes de mots, puis relis la phrase avec fluidité.'}</div><div class="challenge"><h2>⭐ Petit défi de lecture</h2><p>${escapeHtml(p[8])}</p><div class="answers">${p[9].map((a,j)=>`<button data-choice="${j}">${escapeHtml(a)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div></div></div></div>`}function render(){book.classList.toggle('covermode',index<0);book.innerHTML=content();document.getElementById('count').textContent=index<0?'Couverture':`${index+1} / 12`;document.getElementById('prev').disabled=index<0;document.getElementById('next').textContent=index===11?'↻ Couverture':'Page suivante ❯';document.getElementById('colors').setAttribute('aria-pressed',String(colored));try{localStorage.setItem('rj-v3-page',index);localStorage.setItem('rj-v3-level',level);localStorage.setItem('rj-v3-colors',colored)}catch{}}function speak(text,rate=0.82){if(!('speechSynthesis'in window))return alert('La lecture vocale n’est pas disponible sur cet appareil.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=rate;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));if(voice)u.voice=voice;speechSynthesis.speak(u)}function move(dir){if(busy)return;let next=index+dir;if(next>11)next=-1;if(next< -1)return;if('speechSynthesis'in window)speechSynthesis.cancel();busy=true;if(index<0||next<0){index=next;busy=false;render();return}let sheet=document.createElement('div');sheet.className='flip'+(dir<0?' backwards':'');sheet.innerHTML='<div class="side"></div><div class="side rear"></div>';book.append(sheet);let done=false;let finish=()=>{if(done)return;done=true;index=next;busy=false;render()};sheet.addEventListener('animationend',finish,{once:true});setTimeout(finish,800)}book.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.action==='start')return move(1);if(index<0)return;let p=pages[index];if(b.dataset.action==='sound')speak(p[levels.indexOf(level)+2]);if(b.dataset.action==='slow')speak(p[levels.indexOf(level)+2],.58);if(b.dataset.action==='hint')document.getElementById('hint').hidden=!document.getElementById('hint').hidden;if(b.dataset.choice!==undefined){let ok=+b.dataset.choice===p[10];document.getElementById('feedback').textContent=ok?'Bravo ! Tu peux tourner la page.':'Essaie encore : regarde bien les lettres.';b.style.background=ok?'#c9f0d3':'#ffe1d5'}});document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('home').onclick=()=>{index=-1;render()};document.getElementById('level').onchange=e=>{level=e.target.value;render()};document.getElementById('colors').onclick=()=>{colored=!colored;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let sx=0;book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>75)move(d<0?1:-1)},{passive:true});render();
</script></body></html>
