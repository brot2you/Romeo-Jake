const pages=[
['La nuit de Roméo','Chaque soir, Roméo se glisse sous sa couverture bleue, décorée d\'étoiles dorées. Mais ce soir encore, le sommeil ne vient pas. Il regarde la lune ronde derrière sa fenêtre, écoute le vent souffler doucement et imagine des voyages sur des mers lointaines. Dans un coin de la chambre, son grand placard en bois reste silencieux… pour le moment.','Roméo est dans son lit. Il ne dort pas. La lune luit.','Roméo voit la lune. Il reste éveillé.','Roméo regarde la lune par la fenêtre.','Ce soir, Roméo ne trouve pas le sommeil. Il écoute le vent dans les arbres.','Dans sa chambre silencieuse, Roméo contemple les étoiles et cherche en vain le sommeil.','night','Quel son entends-tu au début de « maman » ?',['m','s','l'],0],
['Un drôle de bruit','Alors que la maison semble endormie, un bruit minuscule interrompt les pensées de Roméo. Scritch… scritch… Il se redresse et retient son souffle. Le son vient du grand placard, près de la fenêtre. Est-ce un jouet qui bouge ? Ou quelque chose de bien plus surprenant ?','Roméo a entendu un bruit. Il vient du placard.','Roméo entend un bruit dans le placard.','Un bruit étrange vient du placard.','Un léger grattement résonne derrière la porte du placard.','Un froissement mystérieux rompt le silence : quelque chose s’agite dans le placard.','night','Lis la syllabe « mi ».',['ma','mi','la'],1],
['Capitaine Moustache','La porte du placard s\'entrouvre dans un léger grincement. Une petite souris grise, coiffée d\'un immense chapeau de pirate, apparaît dans un rayon de lumière. Elle s\'incline avec élégance. « Bonsoir, Roméo ! Je suis le capitaine Moustache. Je crois que nous avons besoin de toi ! »','Une souris sort du placard. Elle dit : « Salut, Roméo ! »','Une souris sort du placard.','Une souris dit bonsoir à Roméo.','La souris se présente : elle s’appelle Capitaine Moustache.','Une minuscule souris coiffée d’un tricorne se présente avec une révérence : Capitaine Moustache.','mouse','Quel mot peux-tu lire ?',['ami','ima','mai'],0],
['La clé dorée','Capitaine Moustache fouille dans la poche de son manteau rouge et en sort une clé dorée. Une petite étoile brille à son extrémité. « Cette clé ouvre un chemin que seuls les rêveurs peuvent emprunter », explique-t-il. Roméo se penche, fasciné. Quelle porte une si petite clé peut-elle bien ouvrir ?','La souris a une clé. La clé est dorée.','La souris montre une clé dorée.','La souris montre une clé dorée.','Le capitaine approche sa clé d’une serrure secrète.','Capitaine Moustache révèle une clé dorée qui fait apparaître une serrure invisible.','mouse','Quelle syllabe fait l + a ?',['li','la','al'],1],
['La porte magique','La souris approche la clé de la serrure du placard. Aussitôt, les portes s\'ouvrent sur un paysage incroyable : des vagues turquoise, une plage dorée et, au loin, un grand bateau de pirate. Le vent marin entre dans la chambre. Roméo écarquille les yeux : son placard conduit à un autre monde !','Le placard est ouvert. Roméo voit la mer et un bateau.','Roméo découvre la mer derrière la porte.','Roméo passe la porte et voit la mer.','Derrière la porte, un océan scintille sous les étoiles.','En franchissant le seuil, Roméo découvre un monde parallèle où les vagues brillent comme des diamants.','sea','Lis le mot « il ».',['li','il','la'],1],
['Roméo devient Jake','Un tourbillon d\'étincelles enveloppe Roméo. Son pyjama rayé se transforme en veste bleue bordée d\'or, une écharpe rouge flotte derrière lui et un chapeau de pirate se pose sur sa tête. « Bienvenue, capitaine Roméo Jake ! » s\'exclame Moustache. Le garçon découvre son reflet et sourit fièrement.','Roméo a un habit de pirate. Il est ravi !','Roméo porte un costume de pirate.','Roméo porte maintenant un habit de pirate.','Une pluie d’étincelles transforme son pyjama en costume de pirate.','Sous une pluie d’étincelles, Roméo se métamorphose en jeune capitaine : il devient Roméo Jake.','hero','Quelle syllabe commence « pirate » ?',['pi','pa','po'],0],
['Le bateau des rêves','Sur la plage, un magnifique navire les attend. Ses grandes voiles blanches claquent dans le vent. Capitaine Moustache déplie une carte ancienne sur un tonneau. « Voici notre route, Roméo Jake. Une étoile s\'est perdue quelque part dans l\'archipel. Nous devons la retrouver avant la nuit ! »','Le bateau est sur la mer. La souris a une carte.','Un grand bateau attend sur la plage.','Le bateau part sur la mer.','Les voiles se gonflent : leur voyage peut commencer.','Le majestueux navire quitte la baie tandis que Capitaine Moustache déplie une ancienne carte.','sea','Lis « la ».',['al','li','la'],2],
['L’île des étoiles','Le bateau fend les vagues tandis que le soleil colore les nuages de rose et d\'or. Soudain, une île apparaît à l\'horizon, dominée par une haute montagne et une cascade. Tout en haut scintille une lumière mystérieuse. « Regarde ! » s\'écrie Moustache. « C\'est l\'île des Étoiles. Notre aventure commence vraiment ! »','Roméo voit une île. Une étoile luit au loin.','Roméo aperçoit une île mystérieuse.','Les deux amis vont sur une île.','Le capitaine et Roméo cherchent l’étoile disparue.','Une île mystérieuse se dessine à l’horizon : c’est là que l’étoile perdue serait cachée.','sea','Lis le mot « ami ».',['ami','mai','mia'],0],
['Le coffre caché','Après avoir accosté, Roméo Jake et son ami suivent un sentier bordé de fleurs tropicales. Derrière un énorme rocher couvert de lianes, ils aperçoivent un vieux coffre cerclé de métal. Roméo s\'agenouille pour mieux l\'observer. Sur le couvercle, une étoile est gravée. « Nous l\'avons trouvé ! » murmure-t-il.','Roméo va vers le rocher. Il y a un coffre caché.','Roméo découvre un coffre derrière un rocher.','Roméo trouve un coffre sur la plage.','Un vieux coffre est dissimulé à l’ombre d’un rocher.','Au pied d’un rocher couvert de mousse, Roméo découvre un coffre oublié depuis longtemps.','treasure','Quelle syllabe est « mi » ?',['ma','mi','li'],1],
['Le trésor lumineux','Le coffre s\'ouvre enfin dans un éclat de lumière. À l\'intérieur repose une étoile lumineuse, bien plus précieuse que toutes les pièces d\'or du monde. Roméo Jake la prend délicatement entre ses mains. L\'étoile s\'élève, tourne au-dessus de leurs têtes et rejoint le ciel, où elle se met à briller de mille feux.','Roméo ouvre le coffre. Une étoile brille et vole.','Une étoile lumineuse sort du coffre.','Une étoile brille dans le coffre.','Roméo libère l’étoile qui retrouve sa place dans le ciel.','En soulevant l’étoile lumineuse, Roméo comprend que le véritable trésor est de lui rendre sa liberté.','treasure','Quelle lettre fait le son /l/ ?',['m','l','s'],1],
['Le retour','La mer devient calme et les premières étoiles illuminent le ciel. Capitaine Moustache regarde Roméo Jake avec tendresse. « Tu as accompli une belle mission, capitaine. Mais il est temps de rentrer. » Au bord de la plage, une porte familière apparaît dans un cercle de lumière dorée : celle de son placard.','La souris dit : « Il faut rentrer. » Roméo la suit.','Roméo rentre dans sa chambre.','Roméo retourne dans sa chambre.','Le capitaine raccompagne Roméo par la porte magique.','Après leur aventure, Capitaine Moustache guide son ami jusqu’au passage secret du placard.','mouse','Lis « il ».',['il','li','la'],0],
['Bonne nuit, Roméo','Roméo traverse la porte magique et retrouve sa chambre, son oreiller moelleux et sa couverture étoilée. Sa tenue de pirate redevient un pyjama. Capitaine Moustache lui adresse un dernier salut : « À demain, Roméo Jake ! » Le garçon ferme les yeux. Cette fois, il s\'endort paisiblement, avec un sourire plein de rêves.','Roméo est dans son lit. Il sourit et s\'endort.','Il a un ami.','Roméo se couche et s’endort paisiblement.','Roméo ferme les yeux, heureux de sa belle aventure.','Rassuré par sa merveilleuse aventure, Roméo s’endort paisiblement en rêvant déjà de son prochain voyage.','night','Quel mot désigne un copain ?',['ami','mai','mia'],0]
];
let index=-1,level='CP',colored=false,busy=false;try{index=Math.max(-1,Math.min(11,+(localStorage.getItem('rj-v10-page')??-1)));level=localStorage.getItem('rj-v10-level')||'CP';colored=localStorage.getItem('rj-v10-colors')==='true'}catch{}document.getElementById('level').value=level;const book=document.getElementById('book');const levels=['CP','CE1','CE2','CM1','CM2'];const escapeHtml=value=>String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');function colorize(s){if(!colored)return `<span class="plain">${escapeHtml(s)}</span>`;return s.split(/(\s+)/).map(word=>{if(/^\s+$/.test(word))return word;let syllables=word.match(/.{1,2}/g)||[word];return `<span class="word">${syllables.map(x=>`<span class="syll">${escapeHtml(x)}</span>`).join('')}</span>`}).join('')}function content(){if(index<0)return `<div class="cover"><button data-action="start" class="open-cover" aria-label="Ouvrir le livre">📖 Ouvrir le livre</button></div>`;let p=pages[index],reading=p[levels.indexOf(level)+2];return `<div class="leaf left"><div class="art scene-image" style="background-image:url('assets/page-${String(index+1).padStart(2,'0')}.webp')"></div><div class="scene-title">${escapeHtml(p[0])}</div></div><div class="leaf right"><div class="mobile-art"><div class="art scene-image" style="background-image:url('assets/page-${String(index+1).padStart(2,'0')}.webp')"></div><div class="scene-title">${escapeHtml(p[0])}</div></div><div class="reading"><div class="chapter">TOME 1 · PAGE ${index+1}/12</div><h1>${escapeHtml(p[0])}</h1><div class="narration"><strong>📖 L’histoire · à écouter ou à lire ensemble</strong>${escapeHtml(p[1])}</div><div class="read-label">👀 À toi de lire · ${level}</div><div class="read-text">${colorize(reading)}</div><div class="reader-tools"><button data-action="sound">🔊 Écouter</button><button data-action="slow">🐢 Écouter lentement</button><button data-action="hint">💡 Aide lecture</button></div><div class="level-note" id="hint" hidden>${level==='CP'?'Regarde chaque lettre. Dis les sons, puis assemble-les sans deviner grâce à l’image. Lis chaque mot en assemblant les sons que tu connais. Les couleurs ne sont pas un découpage phonétique fiable.':'Lis le texte à ton rythme. Repère les groupes de mots, puis relis la phrase avec fluidité.'}</div><div class="challenge"><h2>⭐ Petit défi de lecture</h2><p>${escapeHtml(p[8])}</p><div class="answers">${p[9].map((a,j)=>`<button data-choice="${j}">${escapeHtml(a)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div></div></div></div>`}function render(){book.classList.toggle('covermode',index<0);book.innerHTML=content();document.getElementById('count').textContent=index<0?'Couverture':`${index+1} / 12`;document.getElementById('prev').disabled=index<0;document.getElementById('next').textContent=index===11?'↻ Couverture':'Page suivante ❯';document.getElementById('colors').setAttribute('aria-pressed',String(colored));try{localStorage.setItem('rj-v10-page',index);localStorage.setItem('rj-v10-level',level);localStorage.setItem('rj-v10-colors',colored)}catch{}}function speak(text,rate=0.82){if(!('speechSynthesis'in window))return alert('La lecture vocale n’est pas disponible sur cet appareil.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=rate;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));if(voice)u.voice=voice;speechSynthesis.speak(u)}let audioCtx;function pageSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const n=Math.floor(audioCtx.sampleRate*.34),buffer=audioCtx.createBuffer(1,n,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<n;i++){let t=i/n;data[i]=(Math.random()*2-1)*Math.pow(1-t,2)*(.24+.15*Math.sin(t*26));}let src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();filter.type='lowpass';filter.frequency.value=950;gain.gain.value=.22;src.buffer=buffer;src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start()}catch(e){}}function move(dir){if(busy)return;let next=index+dir;if(next>11)next=-1;if(next< -1)return;if('speechSynthesis'in window)speechSynthesis.cancel();busy=true;pageSound();if(index<0||next<0){index=next;busy=false;render();return}let sheet=document.createElement('div');sheet.className='flip'+(dir<0?' backwards':'');sheet.innerHTML='<div class="side"></div><div class="side rear"></div>';book.append(sheet);let done=false;let finish=()=>{if(done)return;done=true;index=next;busy=false;render()};sheet.addEventListener('animationend',finish,{once:true});setTimeout(finish,800)}book.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.action==='start')return move(1);if(index<0)return;let p=pages[index];if(b.dataset.action==='sound')speak(p[levels.indexOf(level)+2]);if(b.dataset.action==='slow')speak(p[levels.indexOf(level)+2],.58);if(b.dataset.action==='hint')document.getElementById('hint').hidden=!document.getElementById('hint').hidden;if(b.dataset.choice!==undefined){let ok=+b.dataset.choice===p[10];document.getElementById('feedback').textContent=ok?'Bravo ! Tu peux tourner la page.':'Essaie encore : regarde bien les lettres.';b.style.background=ok?'#c9f0d3':'#ffe1d5'}});document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('home').onclick=()=>{index=-1;render()};document.getElementById('level').onchange=e=>{level=e.target.value;render()};document.getElementById('colors').onclick=()=>{colored=!colored;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let sx=0;book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>75)move(d<0?1:-1)},{passive:true});document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.querySelector('.app').requestFullscreen()}}catch(e){alert('Le plein écran n’est pas disponible dans ce navigateur. Vous pouvez utiliser F11 sur ordinateur.')}});document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'⛶ Quitter le plein écran':'⛶ Plein écran'});render();
