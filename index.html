{title:'La nuit de Roméo',scene:'Dans la chambre',art:'night',note:'La lune brille derrière la fenêtre.',story:'Ce soir, Roméo ne dort pas.\nIl regarde la lune.\nIl écoute le vent.\nPuis il entend un tout petit bruit…',q:'Écoute le son /a/. Quelle lettre fait ce son ?',options:['a','m','i'],answer:'a',tip:'Prononce le son /a/ puis laisse ton enfant montrer la lettre.'},

let page=Number(localStorage.getItem('romeoJakePage')||-1);if(page< -1||page>=pages.length)page=-1;let muted=localStorage.getItem('romeoJakeMute')==='1';const solved=new Set(JSON.parse(localStorage.getItem('romeoJakeSolved')||'[]'));const book=document.getElementById('book');function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function speak(s){if(muted)return;if(!('speechSynthesis'in window)){alert('La lecture vocale n’est pas disponible sur cet appareil.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=.82;u.pitch=1.06;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;speechSynthesis.speak(u)}function beep(ok){if(muted)return;try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?660:260;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.17)}catch(e){}}function render(){if('speechSynthesis'in window)speechSynthesis.cancel();book.classList.toggle('cover',page===-1);book.classList.remove('flip');void book.offsetWidth;book.classList.add('flip');let html;if(page===-1){html=`<div class="left"><div class="art"></div></div><div class="right"><div class="page-num" style="color:#ffe2a5">LE LIVRE INTERACTIF • TOME 1</div><h1>ROMÉO<br>JAKE</h1><h2>Le secret du placard</h2><p>Et son ami, le Capitaine Moustache</p><button class="btn gold" data-act="start">📖 Ouvrir le livre ❯</button><p style="font-size:14px">Une aventure de pirates pour apprendre à lire, pas à pas.</p></div>`}else{let p=pages[page];html=`<div class="left"><div class="art ${p.art}"></div><div class="scene-tag">✦ ${escapeHTML(p.scene)}</div><div class="scene-note">${escapeHTML(p.note)}</div></div><div class="right"><div class="page-num">Tome 1 · Page ${page+1} sur ${pages.length}</div><h2>${escapeHTML(p.title)}</h2><p class="story">${escapeHTML(p.story)}</p><div class="actions"><button class="btn" data-act="listen">🔊 Écouter l’histoire</button><button class="btn ghost" data-act="tip">💡 Aide adulte</button></div><div class="activity"><div class="activity-head">⚓ Le défi lecture de Roméo Jake</div><div class="activity-question">${escapeHTML(p.q)}</div><div class="choices">${p.options.map((o,i)=>`<button class="choice ${solved.has(page)&&o===p.answer?'good':''}" data-choice="${i}" aria-label="Réponse ${escapeHTML(o)}">${escapeHTML(o)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite">${solved.has(page)?'⭐ Bravo ! Défi réussi.':''}</div></div><div class="hint" id="tip" hidden>${escapeHTML(p.tip)}</div></div>`}book.innerHTML=html;document.getElementById('count').textContent=page===-1?'Couverture':`Page ${page+1} / ${pages.length} • ${solved.size} défi${solved.size>1?'s':''} réussi${solved.size>1?'s':''}`;document.getElementById('fill').style.width=`${page<0?0:(page+1)/pages.length*100}%`;document.getElementById('prev').disabled=page===-1;document.getElementById('prev').style.opacity=page===-1?'.5':'1';document.getElementById('next').textContent=page===pages.length-1?'↻ Recommencer':'Suivant ❯';document.getElementById('sound').textContent=muted?'🔇 Son':'🔊 Son';localStorage.setItem('romeoJakePage',page)}function change(d){page+=d;if(page>=pages.length)page=-1;if(page< -1)page=-1;render()}book.addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.act==='start'){page=0;render()}if(btn.dataset.act==='listen'&&page>=0)speak(pages[page].story);if(btn.dataset.act==='tip'){let el=document.getElementById('tip');el.hidden=!el.hidden}if(btn.dataset.choice!==undefined&&page>=0){let p=pages[page],choice=p.options[Number(btn.dataset.choice)],f=document.getElementById('feedback');if(choice===p.answer){solved.add(page);localStorage.setItem('romeoJakeSolved',JS
