['Un drôle de bruit','Alors que la maison semble endormie, un bruit minuscule interrompt les pensées de Roméo. Scritch… scritch… Il se redresse et retient son souffle. Le son vient du grand placard, près de la fenêtre. Est-ce un jouet qui bouge ? Ou quelque chose de bien plus surprenant ?','Roméo a entendu un bruit. Il vient du placard.','Roméo entend un bruit dans le placard.','Un bruit étrange vient du placard.','Un léger grattement résonne derrière la porte du placard.','Un froissement mystérieux rompt le silence : quelque chose s’agite dans le placard.','night','Lis la syllabe « mi ».',['ma','mi','la'],1],
['Capitaine Moustache','La porte du placard s\'entrouvre dans un léger grincement. Une petite souris grise, coiffée d\'un immense chapeau de pirate, apparaît dans un rayon de lumière. Elle s\'incline avec élégance. « Bonsoir, Roméo ! Je suis le capitaine Moustache. Je crois que nous avons besoin de toi ! »','Une souris sort du placard. Elle dit : « Salut, Roméo ! »','Une souris sort du placard.','Une souris dit bonsoir à Roméo.','La souris se présente : elle s’appelle Capitaine Moustache.','Une minuscule souris coiffée d’un tricorne se présente avec une révérence : Capitaine Moustache.','mouse','Quel mot désigne une personne que l’on aime bien ?',['ami','ima','mai'],0],
['La clé dorée','Capitaine Moustache fouille dans la poche de son manteau rouge et en sort une clé dorée. Une petite étoile brille à son extrémité. « Cette clé ouvre un chemin que seuls les rêveurs peuvent emprunter », explique-t-il. Roméo se penche, fasciné. Quelle porte une si petite clé peut-elle bien ouvrir ?','La souris a une clé. La clé est dorée.','La souris montre une clé dorée.','La petite souris tient une clé dorée.','Le capitaine approche sa clé d’une serrure secrète.','Capitaine Moustache révèle une clé dorée qui scintille dans sa main.','mouse','Quelle syllabe fait l + a ?',['li','la','al'],1],
['La porte magique','La souris approche la clé de la serrure du placard. Aussitôt, les portes s\'ouvrent sur un paysage incroyable : des vagues turquoise, une plage dorée et, au loin, un grand bateau de pirate. Le vent marin entre dans la chambre. Roméo écarquille les yeux : son placard conduit à un autre monde !','Le placard est ouvert. Roméo voit la mer et un bateau.','Roméo découvre la mer derrière la porte.','Roméo passe la porte et voit la mer.','Derrière la porte, un océan scintille sous les étoiles.','En franchissant le seuil, Roméo découvre un monde parallèle où les vagues brillent comme des diamants.','sea','Lis le mot « il ».',['li','il','la'],1],
['Roméo devient Jake','Un tourbillon d\'étincelles enveloppe Roméo. Son pyjama rayé se transforme en veste bleue bordée d\'or, une écharpe rouge flotte derrière lui et un chapeau de pirate se pose sur sa tête. « Bienvenue, capitaine Roméo Jake ! » s\'exclame Moustache. Le garçon découvre son reflet et sourit fièrement.','Roméo a un habit de pirate. Il est ravi !','Roméo porte un costume de pirate.','Roméo porte maintenant un habit de pirate.','Une pluie d’étincelles transforme son pyjama en costume de pirate.','Sous une pluie d’étincelles, Roméo se métamorphose en jeune capitaine : il devient Roméo Jake.','hero','Quelle est la première syllabe de « pirate » ?',['pi','pa','po'],0],
['Le bateau des rêves','Sur la plage, un magnifique navire les attend. Ses grandes voiles blanches claquent dans le vent. Capitaine Moustache déplie une carte ancienne sur un tonneau. « Voici notre route, Roméo Jake. Une étoile s\'est perdue quelque part dans l\'archipel. Nous devons la retrouver avant la nuit ! »','Le bateau est sur la mer. La souris a une carte.','Un grand bateau attend sur la plage.','Le bateau part sur la mer.','Les voiles se gonflent : leur voyage peut commencer.','Avant de prendre la mer, Capitaine Moustache déplie une ancienne carte à bord du majestueux navire.','sea','Lis « la ».',['al','li','la'],2],
['L’île des étoiles','Le bateau fend les vagues tandis que le soleil colore les nuages de rose et d\'or. Soudain, une île apparaît à l\'horizon, dominée par une haute montagne et une cascade. Tout en haut scintille une lumière mystérieuse. « Regarde ! » s\'écrie Moustache. « C\'est l\'île des Étoiles. Notre aventure commence vraiment ! »','Roméo voit une île. Une étoile luit au loin.','Roméo aperçoit une île mystérieuse.','Les deux amis vont sur une île.','Le capitaine et Roméo cherchent l’étoile disparue.','Une île mystérieuse se dessine à l’horizon : c’est là que l’étoile perdue serait cachée.','sea','Lis le mot « ami ».',['ami','mai','mia'],0],
['Le coffre caché','Après avoir accosté, Roméo Jake et son ami suivent un sentier bordé de fleurs tropicales. Derrière un énorme rocher couvert de lianes, ils aperçoivent un vieux coffre cerclé de métal. Roméo s\'agenouille pour mieux l\'observer. Sur le couvercle, une étoile est gravée. « Nous l\'avons trouvé ! » murmure-t-il.','Roméo va vers le rocher. Il y a un coffre caché.','Roméo découvre un coffre derrière un rocher.','Roméo découvre un coffre derrière un rocher.','Un vieux coffre est dissimulé à l’ombre d’un rocher.','Au pied d’un rocher couvert de mousse, Roméo découvre un coffre oublié depuis longtemps.','treasure','Quelle syllabe est « mi » ?',['ma','mi','li'],1],
['Le trésor lumineux','Le coffre s\'ouvre enfin dans un éclat de lumière. À l\'intérieur repose une étoile lumineuse, bien plus précieuse que toutes les pièces d\'or du monde. Roméo Jake la prend délicatement entre ses mains. L\'étoile s\'élève, tourne au-dessus de leurs têtes et rejoint le ciel, où elle se met à briller de mille feux.','Roméo ouvre le coffre. Une étoile brille et vole.','Une étoile lumineuse sort du coffre.','Une étoile brille dans le coffre.','Roméo libère l’étoile qui retrouve sa place dans le ciel.','En soulevant l’étoile lumineuse, Roméo comprend que le véritable trésor est de lui rendre sa liberté.','treasure','Quelle lettre fait le son /l/ ?',['m','l','s'],1],
['Le retour','La mer devient calme et les premières étoiles illuminent le ciel. Capitaine Moustache regarde Roméo Jake avec tendresse. « Tu as accompli une belle mission, capitaine. Mais il est temps de rentrer. » Au bord de la plage, une porte familière apparaît dans un cercle de lumière dorée : celle de son placard.','La souris dit : « Il faut rentrer. » Roméo la suit.','Roméo rentre dans sa chambre.','Roméo retourne dans sa chambre.','Le capitaine raccompagne Roméo par la porte magique.','Après leur aventure, Capitaine Moustache guide son ami jusqu’au passage secret du placard.','mouse','Lis « il ».',['il','li','la'],0],
['Bonne nuit, Roméo','Roméo traverse la porte magique et retrouve sa chambre, son oreiller moelleux et sa couverture étoilée. Sa tenue de pirate redevient un pyjama. Capitaine Moustache lui adresse un dernier salut : « À demain, Roméo Jake ! » Le garçon ferme les yeux. Cette fois, il s\'endort paisiblement, avec un sourire plein de rêves.','Roméo est dans son lit. Il sourit et s\'endort.','Roméo est de retour dans sa chambre.','Roméo se couche et s’endort paisiblement.','Roméo ferme les yeux, heureux de sa belle aventure.','Rassuré par sa merveilleuse aventure, Roméo s’endort paisiblement en rêvant déjà de son prochain voyage.','night','Quel mot désigne un copain ?',['ami','mai','mia'],0]
];
const pagesTome1=pages;const pagesTome2=[["Toc, toc, toc !","Cette nuit, Roméo dort paisiblement sous sa couverture étoilée. Toc, toc, toc ! Quelqu'un frappe à la porte de son placard. Roméo ouvre les yeux : c'est Capitaine Moustache, la petite souris pirate ! « Roméo Jake, nous avons besoin de toi ! » chuchote-t-il.","Roméo est dans son lit. Toc, toc !","Roméo entend frapper au placard.","La souris Moustache frappe au placard.","Une petite souris pirate vient réveiller Roméo.","Au milieu de la nuit, Capitaine Moustache vient chercher Roméo pour une nouvelle mission.","histoire2","Quel bruit entend Roméo ?",["Toc, toc","Miaou","Boum"],0],["Une terrible nouvelle","Moustache déplie une vieille carte sur le lit. Au milieu de la mer se trouve l'île interdite. « Lord Corbeau a enfermé tous les pigeons de l'île dans son château ! » annonce-t-il, très inquiet. Roméo examine la carte. « Alors, allons les libérer ! »","La souris a une carte. Elle a peur.","Moustache montre une île sur la carte.","Un méchant corbeau a enfermé des pigeons.","Moustache annonce une terrible nouvelle : des pigeons sont prisonniers.","Sur une vieille carte, Moustache montre l'île où Lord Corbeau retient les pigeons captifs.","histoire2","Que montre Moustache ?",["Une carte","Une chaussure","Une pomme"],0],["Le retour du capitaine","Roméo bondit de son lit et ouvre son placard magique. Une lumière dorée tourbillonne autour de lui. En un instant, il porte son chapeau de pirate, son gilet et son foulard rouge. « Le capitaine Roméo Jake est de retour ! » s'écrie Moustache.","Roméo met son chapeau.","Roméo devient un petit pirate.","Roméo enfile son costume de pirate.","Grâce au placard magique, Roméo redevient le capitaine Jake.","Dans un tourbillon d'étincelles, Roméo retrouve sa tenue de capitaine pirate.","histoire2","Que met Roméo sur sa tête ?",["Un chapeau","Une couronne","Un bonnet"],0],["Cap sur l'île interdite","Leur bateau fend les vagues d'une mer agitée. Le vent gonfle les voiles et l'écume éclabousse le pont. Roméo Jake tient fermement la barre tandis que Moustache scrute l'horizon avec sa longue-vue. Enfin, une île sombre apparaît au loin.","Le bateau va sur la mer.","Roméo tient la barre du bateau.","Les deux amis voient une île au loin.","Malgré les grosses vagues, le bateau approche de l'île interdite.","Roméo Jake dirige courageusement le navire vers l'île qui se dessine à l'horizon.","histoire2","Où naviguent les amis ?",["Sur la mer","Dans le désert","Dans la forêt"],0],["Le pigeon messager","Soudain, un oiseau blanc se pose sur le bastingage. Il porte d'étonnantes lunettes d'aviateur et un message attaché à la patte. « Je m'appelle Plume ! » roucoule-t-il. Sur le papier, quelques mots sont écrits : « Aidez-nous avant le coucher du soleil ! »","Plume est un pigeon blanc.","Un pigeon arrive avec une lettre.","Plume apporte un message aux pirates.","Un pigeon aux lunettes d'aviateur demande de l'aide.","Plume, un courageux pigeon messager, apporte un appel au secours des prisonniers.","histoire2","Quel animal est Plume ?",["Un pigeon","Un chat","Un chien"],0],["L'île de Bec-Noir","L'île de Bec-Noir se dresse devant eux. De hautes falaises entourent des cascades étincelantes. La brume cache les sentiers et, au sommet d'un rocher, un immense château noir domine la mer. « C'est là que vit Lord Corbeau », murmure Plume.","L'île a un grand château.","Un château se trouve sur l'île.","Le château noir domine les falaises.","Les amis découvrent une île mystérieuse dominée par un château.","Entre les falaises et les cascades, le château de Lord Corbeau surgit de la brume.","histoire2","Que voit-on au sommet de l'île ?",["Un château","Un moulin","Une école"],0],["Le passage secret","Les trois amis longent la plage, puis suivent le bruit d'une cascade. Derrière le rideau d'eau, Roméo aperçoit une petite ouverture dans la roche. « Un passage secret ! » s'exclame-t-il. Plume passe le premier, suivi de Moustache et de Roméo Jake.","Ils voient une grotte.","Une grotte se cache sous l'eau.","Les amis trouvent un tunnel secret.","Derrière une cascade, ils découvrent une entrée cachée.","En écartant les feuillages derrière la cascade, les trois compagnons découvrent un tunnel.","histoire2","Où est caché le tunnel ?",["Derrière la cascade","Sous le bateau","Dans un arbre"],0],["Le terrible Lord Corbeau","Dans la grande salle du château, Lord Corbeau se tient sur son trône. Son long manteau violet traîne sur les dalles. Il brandit un sceptre couronné d'un cristal rouge. « Aucun pigeon ne quittera mon île ! » croasse-t-il. Mais les pirates ont déjà un plan.","Le corbeau a un bâton rouge.","Lord Corbeau tient un sceptre.","Le méchant corbeau garde son château.","Lord Corbeau brandit un cristal rouge et menace les pigeons.","Sur son trône, Lord Corbeau jure qu'aucun de ses prisonniers ne pourra s'échapper.","histoire2","De quelle couleur est le cristal ?",["Rouge","Bleu","Vert"],0],["La prison des pigeons","Au bout d'un couloir, Roméo et Moustache découvrent une immense volière. Derrière les barreaux, des dizaines de pigeons les regardent avec espoir. « Plume nous a envoyés ! » chuchote Roméo. Les oiseaux battent doucement des ailes : le secours est enfin arrivé.","Les pigeons sont en cage.","Roméo voit des pigeons enfermés.","Les pigeons attendent qu'on les libère.","Les deux pirates découvrent une immense prison remplie de pigeons.","Derrière les barreaux de la volière, des dizaines de pigeons espèrent retrouver leur liberté.","histoire2","Qui est enfermé dans les cages ?",["Des pigeons","Des poissons","Des lapins"],0],["Le grand sauvetage","Roméo Jake trouve le verrou de la grande cage et le soulève. Clac ! La porte s'ouvre. Moustache fait signe aux pigeons de passer l'un après l'autre. Plume guide ses amis vers la sortie. « Vite, suivez-nous ! » souffle Roméo tandis que les oiseaux prennent leur envol.","Roméo ouvre la cage.","Roméo libère les pigeons.","Moustache aide les pigeons à sortir.","Roméo ouvre les portes pendant que ses amis guident les pigeons.","En soulevant le verrou, Roméo Jake permet aux pigeons de s'échapper de leur prison.","histoire2","Que fait Roméo ?",["Il ouvre les cages","Il ferme la porte","Il dort"],0],["La revanche des pigeons","Un grand nuage d'ailes blanches et grises entoure le château. Les pigeons volent de tour en tour et masquent la vue de Lord Corbeau, qui ne sait plus où regarder. Pendant ce temps, Roméo, Moustache et Plume rejoignent le bateau. Les plans du méchant corbeau ont échoué !","Les pigeons volent très haut.","Les pigeons entourent le château.","Les oiseaux déjouent les plans du corbeau.","Des centaines de pigeons s'envolent autour du château et surprennent Lord Corbeau.","En tournoyant autour des tours, les pigeons déjouent les plans de Lord Corbeau et retrouvent la liberté.","histoire2","Qui vole autour du château ?",["Les pigeons","Les poissons","Les papillons"],0],["Le héros des oiseaux","Sur la plage, tous les pigeons se rassemblent pour remercier leurs héros. Plume offre une belle plume blanche à Roméo Jake en souvenir. « Merci, capitaine ! » roucoulent les oiseaux. Moustache salue la foule. Le soleil se couche sur la mer, et une nouvelle aventure se termine.","Les pigeons disent merci.","Tous les pigeons remercient Roméo.","Plume offre une plume blanche à Roméo.","Sur la plage, les pigeons célèbrent leur liberté avec les deux pirates.","Au soleil couchant, les oiseaux remercient Roméo Jake et Capitaine Moustache pour leur courage.","histoire2","Que disent les pigeons ?",["Merci !","Au revoir !","Attention !"],0]];

let index=-1,level='CP',colored=false,busy=false;try{tome=+(localStorage.getItem('rj-active-tome')||1)===2?2:1;index=Math.max(-1,Math.min(11,+(localStorage.getItem('rj-tome-'+tome+'-page')??-1)));level=localStorage.getItem('rj-v10-level')||'CP';colored=localStorage.getItem('rj-v10-colors')==='true'}catch{}document.getElementById('level').value=level;const book=document.getElementById('book');const levels=['CP','CE1','CE2','CM1','CM2'];const escapeHtml=value=>String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');function colorize(s){if(!colored)return `<span class="plain">${escapeHtml(s)}</span>`;return s.split(/(\s+)/).map(word=>{if(/^\s+$/.test(word))return word;let syllables=word.match(/.{1,2}/g)||[word];return `<span class="word">${syllables.map(x=>`<span class="syll">${escapeHtml(x)}</span>`).join('')}</span>`}).join('')}function content(){if(index<0)return `<div class="cover"><div class="tome-choice"><button data-action="tome1" class="open-cover">📘 Tome 1 · L’île des étoiles</button><button data-action="tome2" class="open-cover">📗 Tome 2 · L’île interdite</button></div></div>`;let p=activePages()[index],reading=p[levels.indexOf(level)+2];return `<div class="leaf left"><div class="art scene-image" style="background-image:url('${tome===1?'assets/':'assets/histoire-2/'}page-${String(index+1).padStart(2,'0')}.webp')"></div><div class="scene-title">${escapeHtml(p[0])}</div></div><div class="leaf right"><div class="mobile-art"><div class="art scene-image" style="background-image:url('${tome===1?'assets/':'assets/histoire-2/'}page-${String(index+1).padStart(2,'0')}.webp')"></div><div class="scene-title">${escapeHtml(p[0])}</div></div><div class="reading"><div class="chapter">TOME ${tome} · PAGE ${index+1}/12</div><h1>${escapeHtml(p[0])}</h1><div class="narration"><strong>📖 L’histoire · à écouter ou à lire ensemble</strong>${escapeHtml(p[1])}</div><div class="read-label">👀 À toi de lire · ${level}</div><div class="read-text">${colorize(reading)}</div><div class="reader-tools"><button data-action="sound">🔊 Écouter</button><button data-action="slow">🐢 Écouter lentement</button><button data-action="hint">💡 Aide lecture</button></div><div class="level-note" id="hint" hidden>${level==='CP'?'Regarde chaque lettre. Dis les sons, puis assemble-les sans deviner grâce à l’image. Lis chaque mot en assemblant les sons que tu connais. Les couleurs ne sont pas un découpage phonétique fiable.':'Lis le texte à ton rythme. Repère les groupes de mots, puis relis la phrase avec fluidité.'}</div><div class="challenge"><h2>⭐ Petit défi de lecture</h2><p>${escapeHtml(p[8])}</p><div class="answers">${p[9].map((a,j)=>`<button data-choice="${j}">${escapeHtml(a)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div></div></div></div>`}function render(){book.classList.toggle('covermode',index<0);book.classList.toggle('tome2',tome===2);book.innerHTML=content();document.getElementById('count').textContent=index<0?'Couverture':`${index+1} / 12`;document.getElementById('prev').disabled=index<0;document.getElementById('next').textContent=index===11?'↻ Choisir une aventure':'Page suivante ❯';document.getElementById('colors').setAttribute('aria-pressed',String(colored));try{localStorage.setItem('rj-tome-'+tome+'-page',index);localStorage.setItem('rj-active-tome',tome);localStorage.setItem('rj-v10-level',level);localStorage.setItem('rj-v10-colors',colored)}catch{}}function speak(text,rate=0.82){if(!('speechSynthesis'in window))return alert('La lecture vocale n’est pas disponible sur cet appareil.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=rate;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));if(voice)u.voice=voice;speechSynthesis.speak(u)}let audioCtx;function pageSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const n=Math.floor(audioCtx.sampleRate*.34),buffer=audioCtx.createBuffer(1,n,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<n;i++){let t=i/n;data[i]=(Math.random()*2-1)*Math.pow(1-t,2)*(.24+.15*Math.sin(t*26));}let src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();filter.type='lowpass';filter.frequency.value=950;gain.gain.value=.22;src.buffer=buffer;src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start()}catch(e){}}function move(dir){if(busy)return;let next=index+dir;if(next>11)next=-1;if(next< -1)return;if('speechSynthesis'in window)speechSynthesis.cancel();busy=true;pageSound();if(index<0||next<0){index=next;busy=false;render();return}let sheet=document.createElement('div');sheet.className='flip'+(dir<0?' backwards':'');sheet.innerHTML='<div class="side"></div><div class="side rear"></div>';book.append(sheet);let done=false;let finish=()=>{if(done)return;done=true;index=next;busy=false;render()};sheet.addEventListener('animationend',finish,{once:true});setTimeout(finish,800)}book.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.action==='tome1'||b.dataset.action==='tome2'){tome=b.dataset.action==='tome1'?1:2;index=-1;render();return move(1)}if(b.dataset.action==='start')return move(1);if(index<0)return;let p=activePages()[index];if(b.dataset.action==='sound')speak(p[levels.indexOf(level)+2]);if(b.dataset.action==='slow')speak(p[levels.indexOf(level)+2],.58);if(b.dataset.action==='hint')document.getElementById('hint').hidden=!document.getElementById('hint').hidden;if(b.dataset.choice!==undefined){let ok=+b.dataset.choice===p[10];document.getElementById('feedback').textContent=ok?'Bravo ! Tu peux tourner la page.':'Essaie encore : regarde bien les lettres.';b.style.background=ok?'#c9f0d3':'#ffe1d5'}});document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('home').onclick=()=>{index=-1;render()};document.getElementById('level').onchange=e=>{level=e.target.value;render()};document.getElementById('colors').onclick=()=>{colored=!colored;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let sx=0;book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>75)move(d<0?1:-1)},{passive:true});document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.querySelector('.app').requestFullscreen()}}catch(e){alert('Le plein écran n’est pas disponible dans ce navigateur. Vous pouvez utiliser F11 sur ordinateur.')}});document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'⛶ Quitter le plein écran':'⛶ Plein écran'});render();
